<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>延長申請フォーム</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
      margin: 0;
      padding: 16px;
      background-color: #f5f5f5;

      /* スマホ固定用 */
      width: 100%;
      min-height: 100vh;
      box-sizing: border-box;
    }

    .container {
      background: #fff;
      border-radius: 12px;
      padding: 20px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);

      width: 95%;         
      max-width: 700px;   
      margin: 20px auto;   
    }

    h1 {
      font-size: 1.4em;
      text-align: center;
      margin-bottom: 24px;
    }

    label {
      font-weight: bold;
      display: block;
      margin-top: 16px;
    }

    input, select {
      width: 100%;
      padding: 10px;
      border-radius: 8px;
      border: 1px solid #ccc;
      margin-top: 6px;
      font-size: 1em;
      box-sizing: border-box;
    }

    button {
      margin-top: 24px;
      width: 100%;
      background-color: #007aff;
      color: white;
      border: none;
      border-radius: 8px;
      padding: 12px;
      font-size: 1.1em;
    }

    button:hover {
      background-color: #005ecb;
    }

    .hidden {
      display: none;
    }

    .item-image {
      width: 100%;
      height: auto;
      display: block;
      object-fit: cover;
      border-radius: 6px; 
    }

  </style>
</head>
<body>
  <div class="container" id="loginView">
    <h1>延長申請ログイン</h1>
    <label for="email">メールアドレス</label>
    <input type="email" id="email" placeholder="y200000@mail.ryukoku.ac.jp">
    <button onclick="SubmitEmail()">次へ</button>
  </div>

  <div class="container hidden" id="formView">
    <h1>延長申請フォーム</h1>
    <div id="itemList"></div>
    <button onclick="SubmitForm()">申請する</button>
  </div>

  <div class="container hidden" id="doneView">
    <h1>申請を受け付けました</h1>
    <p>申請内容を確認後、メールにて通知いたします。</p>
  </div>

  <script>
    // メールアドレスを検証してフォームを表示
    function SubmitEmail() {
      let email = document.getElementById('email').value.trim();
      if (email.substr(email.length - 19) !== '@mail.ryukoku.ac.jp') { 
        alert('入力形式が正しくありません。龍谷大学のメールアドレスを使用してください。');
        return;
      }
      google.script.run
        .withSuccessHandler(ShowForm)
        .GetItemsByEmail(email);
    }

    // 物品リスト表示
    function ShowForm(items) {
      // console.log(items);
      if (!items || items.length === 0) {
        alert('該当する物品が見つかりません');
        return;
      }
      document.getElementById('loginView').classList.add('hidden');
      document.getElementById('formView').classList.remove('hidden');

      const listContainer = document.getElementById('itemList');
      listContainer.innerHTML = '';
      
      items.forEach(item => {
        // Calculate tomorrow's date in yyyy-MM-dd format (Asia/Tokyo)
        const today = new Date();
        const tomorrow = new Date(today);
        tomorrow.setDate(today.getDate() + 1);
        // Format as yyyy-MM-dd
        const pad = n => n < 10 ? '0' + n : n;
        const minDate = tomorrow.getFullYear() + '-' + pad(tomorrow.getMonth() + 1) + '-' + pad(tomorrow.getDate());

        const div = document.createElement('div');
        div.innerHTML = `
        <div class="item-block">
          <label>${item.organ} - ${item.name}</label>
          <input type="date" id="date-${item.id}" max="${item.maxDate}" min="${minDate}" value="${item.handover}">
          <img src="${item.image}" alt="image" class="item-image" />
        </div>`;
        listContainer.appendChild(div);
      });

    }

    // 申請内容送信
    function SubmitForm() {
      // すべての日付入力を取得
      const dateInputs = document.querySelectorAll('#itemList input[type="date"]');
      let results = [];

      dateInputs.forEach(input => {
        // console.log(`input`);
        // console.log(input);
        const id = input.id.replace('date-', '');
        const newDate = input.value;

        results.push({
          id: Number(id),
          newDate: newDate
        });
      });

      const hasEmpty = results.some(r => !r.newDate);
      if (hasEmpty) {
        alert('すべての日付を入力してください');
        return;
      }

      // console.log(`pushed:`);
      // console.log(results);
      
      google.script.run
        .withSuccessHandler(() => {
          document.getElementById('formView').classList.add('hidden');
          document.getElementById('doneView').classList.remove('hidden');
        })
        .NotifyExtensionRequest(results);
    }

  </script>
</body>
</html>
