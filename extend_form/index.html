<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>延長申請フォーム</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
      margin: 0;
      padding: 16px;
      background-color: #f5f5f5;
    }
    .container {
      background: #fff;
      border-radius: 12px;
      padding: 20px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
      max-width: 480px;
      margin: 40px auto;
    }
    h1 {
      font-size: 1.4em;
      text-align: center;
      margin-bottom: 24px;
    }
    label {
      font-weight: bold;
      display: block;
      margin-top: 16px;
    }
    input, select {
      width: 93%;
      padding: 10px;
      border-radius: 8px;
      border: 1px solid #ccc;
      margin-top: 6px;
      font-size: 1em;
    }
    button {
      margin-top: 24px;
      width: 100%;
      background-color: #007aff;
      color: white;
      border: none;
      border-radius: 8px;
      padding: 12px;
      font-size: 1.1em;
    }
    button:hover {
      background-color: #005ecb;
    }
    .hidden {
      display: none;
    }
  </style>
</head>
<body>
  <div class="container" id="loginView">
    <h1>延長申請ログイン</h1>
    <label for="email">メールアドレス</label>
    <input type="email" id="email" placeholder="y200000@mail.ryukoku.ac.jp">
    <button onclick="SubmitEmail()">次へ</button>
  </div>

  <div class="container hidden" id="formView">
    <h1>延長申請フォーム</h1>
    <div id="itemList"></div>
    <button onclick="SubmitForm()">申請する</button>
  </div>

  <div class="container hidden" id="doneView">
    <h1>申請を受け付けました</h1>
    <p>申請内容を確認後、メールにて通知いたします。</p>
  </div>

  <script>
    // メールアドレスを検証してフォームを表示
    function SubmitEmail() {
      let email = document.getElementById('email').value.trim();
      if (email.substr(email.length - 19) !== '@mail.ryukoku.ac.jp') { 
        alert('入力形式が正しくありません。龍谷大学のメールアドレスを使用してください。');
        return;
      }
      google.script.run
        .withSuccessHandler(ShowForm)
        .GetItemsByEmail(email);
    }

    function SubmitForm() {
      // ここにフォーム送信のロジックを追加
      document.getElementById('formView').classList.add('hidden');
      document.getElementById('doneView').classList.remove('hidden');
    }

    // 物品リスト表示
    function ShowForm(items) {
      console.log(items);
      if (!items || items.length === 0) {
        alert('該当する物品が見つかりません');
        return;
      }
      document.getElementById('loginView').classList.add('hidden');
      document.getElementById('formView').classList.remove('hidden');

      const listContainer = document.getElementById('itemList');
      listContainer.innerHTML = '';
      
      items.forEach(item => {
        const div = document.createElement('div');
        div.innerHTML = `
        <div class="item-block">
          <label>${item.organ} - ${item.name}</label>
          <input type="date" id="date-${item.id}" max="${item.maxDate}" value="${item.handover}">
          <img src="${item.image}" alt="image" class="item-image" />
        </div>`;
        listContainer.appendChild(div);
      });

    }

  </script>
</body>
</html>
