<!DOCTYPE html>
<html>
  <head>
    <base target="_top" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      <?!= include('style'); ?>
    </style>
  </head>
  <body>
    <div class="header-container">
      <div class="button-left">
        <button>アーカイブシートを見る</button>
      </div>
      <div class="button-group">
        <button id="completeButton" type="button">撤去済みにする</button>
        <button id="discardButton" type="button">破棄済みにする</button>
        <button id="deleteButton" type="button">データから削除</button>
      </div>
    </div>
    <? if (!data || data.length === 0) { ?>
    <p>データがありません</p>
    <? } else { ?>
    <table>
      <colgroup>
        <col class="col-check" />
        <col class="col-name" />
        <col class="col-organization" />
        <col class="col-photo" />
        <col class="col-handover_on" />
        <col class="col-status" />
        <col class="col-admin_note" />
      </colgroup>
      <thead>
        <tr>
          <th class="col-check">check</th>
          <? 
              var header = data[0];
              for (var j = 0; j < header.length; j++) {
            ?>
              <? if (j+1 === registered) { ?>
                <!-- 列の省略 -->
              <? } else if (j+1 === email) { ?>
                <!-- 列の省略 -->
              <? } else if (j+1 === days) { ?>
                <!-- 列の省略 -->
              <? } else { ?>
                <th><?!= header[j] != null ? header[j] : "" ?></th>
              <? } ?>
            <? } ?>
          </tr>
        </thead>
        <tbody>
          <? for (var i = 1; i < data.length; i++) { ?>
            <tr data-row-index="<?!= i + 1 ?>">
              <td><input type="checkbox" class="row-check"></td>
              <? for (var j = 0; j < data[i].length; j++) { ?>
                <? if (j+1 === registered) { ?>
                <!-- 列の省略 -->
                <? } else if (j+1 === email) { ?>
                <!-- 列の省略 -->
                <? } else if (j+1 === name) { ?>
                  <td data-email="<?!= data[i][email - 1] ?>"><?!= data[i][j] != null ? data[i][j] : "" ?></td>
                <? } else if (j+1 === photo) { ?>
                  <? if (data[i][j] != null && data[i][j] !== "") { ?>

          <? var imgUrl = "https://lh3.googleusercontent.com/d/" + data[i][j]; ?>
          <td class="col-photo">
            <img src="<?!= imgUrl ?>" />
          </td>
          <? } else { ?>
          <td class="col-photo"></td>
          <? } ?>
          <? } else if (j+1 === days) { ?>
          <!-- 列の省略 -->
          <? } else { ?>
          <? var cellHeader = header[j]; ?>
          <? if (cellHeader === 'organization') { ?>
          <td class="col-organization">
            <?!= data[i][j] != null ? data[i][j] : "" ?>
          </td>
          <? } else if (cellHeader === 'handover_on') { ?>
          <td class="col-handover_on">
            <?!= data[i][j] != null ? data[i][j] : "" ?>
          </td>
          <? } else if (cellHeader === 'status') { ?>
          <td class="col-status">
            <?!= data[i][j] != null ? data[i][j] : "" ?>
          </td>
          <? } else if (cellHeader === 'admin_note') { ?>
          <td class="col-admin_note">
            <?!= data[i][j] != null ? data[i][j] : "" ?>
          </td>
          <? } else { ?>
          <td><?!= data[i][j] != null ? data[i][j] : "" ?></td>
          <? } ?>
          <? } ?>
          <? } ?>
        </tr>
        <? } ?>
      </tbody>
    </table>
    <? } ?>
    <script>
      (function () {
        const completeButton = document.getElementById('completeButton');
        if (!completeButton) {
          return;
        }

        const discardButton = document.getElementById('discardButton');
        if (!discardButton) {
          return;
        }

        const deleteButton = document.getElementById('deleteButton');
        if (!deleteButton) {
          return;
        }

        const archiveSetLoadingState = (isLoading) => {
          completeButton.disabled = isLoading;
          completeButton.textContent = isLoading ? '処理中...' : '撤去済みにする';
        };

        const discardSetLoadingState = (isLoading) => {
          discardButton.disabled = isLoading;
          discardButton.textContent = isLoading ? '処理中...' : '破棄済みにする';
        };

        const deleteSetLoadingState = (isLoading) => {
          deleteButton.disabled = isLoading;
          deleteButton.textContent = isLoading ? '処理中...' : 'データから削除';
        };

        completeButton.addEventListener('click', () => {
          const checkedRows = Array.from(
            document.querySelectorAll('tbody input.row-check:checked')
          )
            .map((checkbox) => {
              const tr = checkbox.closest('tr');
              return tr ? Number(tr.dataset.rowIndex) : NaN;
            })
            .filter((rowNumber) => Number.isInteger(rowNumber));

          if (!checkedRows.length) {
            alert('チェックされた行がありません。');
            return;
          }

          archiveSetLoadingState(true);
          google.script.run
            .withSuccessHandler(() => {
              location.reload();
            })
            .withFailureHandler((err) => {
              alert(err && err.message ? err.message : '処理に失敗しました。');
              archiveSetLoadingState(false);
            })
            .completeRows(checkedRows);
        });

        discardButton.addEventListener('click', () => {
          const checkedRows = Array.from(
            document.querySelectorAll('tbody input.row-check:checked')
          )
            .map((checkbox) => {
              const tr = checkbox.closest('tr');
              return tr ? Number(tr.dataset.rowIndex) : NaN;
            })
            .filter((rowNumber) => Number.isInteger(rowNumber));

          if (!checkedRows.length) {
            alert('チェックされた行がありません。');
            return;
          }

          discardSetLoadingState(true);
          google.script.run
            .withSuccessHandler(() => {
              location.reload();
            })
            .withFailureHandler((err) => {
              alert(err && err.message ? err.message : '処理に失敗しました。');
              discardSetLoadingState(false);
            })
            .discardRows(checkedRows);
        });

        deleteButton.addEventListener('click', () => {
          const checkedRows = Array.from(
            document.querySelectorAll('tbody input.row-check:checked')
          )
            .map((checkbox) => {
              const tr = checkbox.closest('tr');
              return tr ? Number(tr.dataset.rowIndex) : NaN;
            })
            .filter((rowNumber) => Number.isInteger(rowNumber));

          if (!checkedRows.length) {
            alert('チェックされた行がありません。');
            return;
          }

          if (!confirm('選択した行をデータから完全に削除します。この操作は取り消せません。よろしいですか？')) {
            return;
          }
          deleteSetLoadingState(true);
          google.script.run
            .withSuccessHandler(() => {
              location.reload();
            })
            .withFailureHandler((err) => {
              alert(err && err.message ? err.message : '処理に失敗しました。');
              deleteSetLoadingState(false);
            })
            .deleteRows(checkedRows);
        });
      })();
    </script>
  </body>
</html>
