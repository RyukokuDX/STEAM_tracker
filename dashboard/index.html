<!DOCTYPE html>
<html>
  <head>
    <base target="_top">
    <style>
      table {
        border-collapse: collapse; /* 枠線の重なりをなくす */
        width: 100%;
        margin-top: 20px;
      }
      th, td {
        border: 1px solid #555; /* 枠線を表示 */
        padding: 8px; /* 余白を追加して見やすく */
        text-align: left;
      }
      th {
        background-color: #f2f2f2; /* ヘッダー部分をグレーに */
      }
      tr:nth-child(even) {
        background-color: #fafafa; /* 偶数行に薄い色を付ける */
      }
      .header-container {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 10px;
        margin-top: 10px;
      }
      .button-left {
        display: flex;
        gap: 8px;
      }
      .button-left button {
        padding: 8px 16px;
        font-size: 14px;
        cursor: pointer;
        border: 1px solid #ccc;
        border-radius: 4px;
        background-color: #2196F3;
        color: white;
        border-color: #2196F3;
      }
      .button-left button:hover {
        background-color: #0b7dda;
      }
      .button-group {
        display: flex;
        gap: 8px;
      }
      .button-group button {
        padding: 8px 16px;
        font-size: 14px;
        cursor: pointer;
        border: 1px solid #ccc;
        border-radius: 4px;
        background-color: #fff;
      }
      .button-group button:hover {
        background-color: #f5f5f5;
      }
      .button-group button:first-child {
        background-color: #4CAF50;
        color: white;
        border-color: #4CAF50;
      }
      .button-group button:first-child:hover {
        background-color: #45a049;
      }
      .button-group button:nth-child(2) {
        background-color: #ff9800;
        color: white;
        border-color: #ff9800;
      }
      .button-group button:nth-child(2):hover {
        background-color: #e68900;
      }
      .button-group button:last-child {
        background-color: #f44336;
        color: white;
        border-color: #f44336;
      }
      .button-group button:last-child:hover {
        background-color: #da190b;
      }
      td[data-email] {
        position: relative;
        cursor: pointer;
      }
      td[data-email]:hover::after {
        content: attr(data-email);
        position: absolute;
        bottom: 100%;
        left: 50%;
        transform: translateX(-50%);
        background-color: #333;
        color: white;
        padding: 6px 10px;
        border-radius: 4px;
        white-space: nowrap;
        z-index: 1000;
        margin-bottom: 5px;
        font-size: 12px;
        box-shadow: 0 2px 5px rgba(0,0,0,0.2);
      }
      td[data-email]:hover::before {
        content: '';
        position: absolute;
        bottom: 95%;
        left: 50%;
        transform: translateX(-50%);
        border: 5px solid transparent;
        border-top-color: #333;
        z-index: 1000;
      }
    </style>
  </head>
  <body>
    <h1>スプレッドシート：<?!= sheetName ?></h1>
    <div class="header-container">
      <div class="button-left">
        <button>アーカイブへ</button>
      </div>
      <div class="button-group">
        <button>完了</button>
        <button>破棄</button>
        <button>削除</button>
      </div>
    </div>
    <? if (!data || data.length === 0) { ?>
      <p>データがありません</p>
    <? } else { ?>
      <table>
        <thead>
          <tr>
            <th>check</th>
            <? 
              var header = data[0];
              for (var j = 0; j < header.length; j++) {
            ?>
              <? if (j+1 === registered) { ?>
                <!-- 列の省略 -->
              <? } else if (j+1 === email) { ?>
                <!-- 列の省略 -->
              <? } else if (j+1 === days) { ?>
                <!-- 列の省略 -->
              <? } else { ?>
                <th><?!= header[j] != null ? header[j] : "" ?></th>
              <? } ?>
            <? } ?>
          </tr>
        </thead>
        <tbody>
          <? for (var i = 1; i < data.length; i++) { ?>
            <tr>
              <td><input type="checkbox"></td>
              <? for (var j = 0; j < data[i].length; j++) { ?>
                <? if (j+1 === registered) { ?>
                <!-- 列の省略 -->
                <? } else if (j+1 === email) { ?>
                <!-- 列の省略 -->
                <? } else if (j+1 === name) { ?>
                  <td data-email="<?!= data[i][email - 1] ?>"><?!= data[i][j] != null ? data[i][j] : "" ?></td>
                <? } else if (j+1 === photo) { ?>
                  <? if (data[i][j] != null && data[i][j] !== "") { ?>

                    <? var imgUrl = "https://lh3.googleusercontent.com/d/" + data[i][j]; ?>
                    <td><img src="<?!= imgUrl ?>" style="width:40px; height:40px; border-radius:50%;"></td>
                  <? } else { ?>
                    <td></td>
                  <? } ?>
                <? } else if (j+1 === days) { ?>
                <!-- 列の省略 -->
                <? } else { ?>
                  <td><?!= data[i][j] != null ? data[i][j] : "" ?></td>
                <? } ?>
              <? } ?>
            </tr>
          <? } ?>
        </tbody>
      </table>
    <? } ?>
  </body>
</html>
