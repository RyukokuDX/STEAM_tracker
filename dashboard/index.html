<!DOCTYPE html>
<html>
  <head>
    <base target="_top" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      <?!= include('style'); ?>
    </style>
  </head>
  <body>
    <div class="header-container">
      <div class="title-group">
        <h1 class="app-title">
          管理シート:
          <?!= sheetName ?>
        </h1>
      </div>
      <div class="controls">
        <div class="button-left">
          <button>アーカイブへ</button>
        </div>
        <div class="button-group">
          <button>完了</button>
          <button>破棄</button>
          <button>削除</button>
        </div>
      </div>
    </div>
    <? if (!data || data.length === 0) { ?>
    <p>データがありません</p>
    <? } else { ?>
    <table>
      <colgroup>
        <col class="col-check" />
        <col class="col-name" />
        <col class="col-organization" />
        <col class="col-photo" />
        <col class="col-handover_on" />
        <col class="col-status" />
        <col class="col-admin_note" />
      </colgroup>
      <thead>
        <tr>
          <th class="col-check">check</th>
          <? 
              var header = data[0];
              for (var j = 0; j < header.length; j++) {
            ?>
          <? if (j+1 === registered) { ?>
          <!-- 列の省略 -->
          <? } else if (j+1 === email) { ?>
          <!-- 列の省略 -->
          <? } else if (j+1 === days) { ?>
          <!-- 列の省略 -->
          <? } else { ?>
          <? if (j+1 === name) { ?>
          <th class="col-name"><?!= header[j] != null ? header[j] : "" ?></th>
          <? } else if (j+1 === photo) { ?>
          <th class="col-photo"><?!= header[j] != null ? header[j] : "" ?></th>
          <? } else if (header[j] === 'organization') { ?>
          <th class="col-organization"><?!= header[j] ?></th>
          <? } else if (header[j] === 'handover_on') { ?>
          <th class="col-handover_on"><?!= header[j] ?></th>
          <? } else if (header[j] === 'status') { ?>
          <th class="col-status"><?!= header[j] ?></th>
          <? } else if (header[j] === 'admin_note') { ?>
          <th class="col-admin_note"><?!= header[j] ?></th>
          <? } else { ?>
          <th><?!= header[j] != null ? header[j] : "" ?></th>
          <? } ?>
          <? } ?>
          <? } ?>
        </tr>
      </thead>
      <tbody>
        <? for (var i = 1; i < data.length; i++) { ?>
        <tr>
          <td class="col-check"><input type="checkbox" /></td>
          <? for (var j = 0; j < data[i].length; j++) { ?>
          <? if (j+1 === registered) { ?>
          <!-- 列の省略 -->
          <? } else if (j+1 === email) { ?>
          <!-- 列の省略 -->
          <? } else if (j+1 === name) { ?>
          <td class="col-name" data-email="<?!= data[i][j - 1] ?>">
            <?!= data[i][j] != null ? data[i][j] : "" ?>
          </td>
          <? } else if (j+1 === photo) { ?>
          <? if (data[i][j] != null && data[i][j] !== "") { ?>

          <? var imgUrl = "https://lh3.googleusercontent.com/d/" + data[i][j]; ?>
          <td class="col-photo">
            <img
              src="<?!= imgUrl ?>"
              style="width: 40px; height: 40px; border-radius: 50%"
            />
          </td>
          <? } else { ?>
          <td class="col-photo"></td>
          <? } ?>
          <? } else if (j+1 === days) { ?>
          <!-- 列の省略 -->
          <? } else { ?>
          <? var cellHeader = header[j]; ?>
          <? if (cellHeader === 'organization') { ?>
          <td class="col-organization">
            <?!= data[i][j] != null ? data[i][j] : "" ?>
          </td>
          <? } else if (cellHeader === 'handover_on') { ?>
          <td class="col-handover_on">
            <?!= data[i][j] != null ? data[i][j] : "" ?>
          </td>
          <? } else if (cellHeader === 'status') { ?>
          <td class="col-status">
            <?!= data[i][j] != null ? data[i][j] : "" ?>
          </td>
          <? } else if (cellHeader === 'admin_note') { ?>
          <td class="col-admin_note">
            <?!= data[i][j] != null ? data[i][j] : "" ?>
          </td>
          <? } else { ?>
          <td><?!= data[i][j] != null ? data[i][j] : "" ?></td>
          <? } ?>
          <? } ?>
          <? } ?>
        </tr>
        <? } ?>
      </tbody>
    </table>
    <? } ?>
  </body>
</html>
