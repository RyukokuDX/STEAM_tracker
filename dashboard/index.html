<!DOCTYPE html>
<html>
  <head>
    <base target="_top">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <style>
      /* ===== Theme tokens (from demo) ===== */
      :root {
        --primary: #10b981;
        --primary-600: #059669;
        --primary-100: #d1fae5;
        --surface: #FFF1D0; /* washi-like */
        --card: #ffffff;
        --border: rgba(0,0,0,0.12);
        --table-border: #cbbf99;
        --table-grid: rgba(0,0,0,0.12);
        --text: #1f2937;
        --muted: #6b7280;
        --row-alt: rgba(16,185,129,0.04);
        --row-hover: rgba(16,185,129,0.08);
        --row-selected: rgba(16,185,129,0.16);
        --thead-bg: rgba(16,185,129,0.15);
        --thead-bg-muted: #f2f2f2;
        --focus-ring: #99ccff;
        --tooltip-bg: #333333;
        --tooltip-fg: #ffffff;
        --success: #4CAF50; --success-hover: #45a049;
        --warning: #ff9800; --warning-hover: #e68900;
        --danger: #f44336; --danger-hover: #da190b;
        --radius: 10px;
        --shadow-sm: 0 10px 30px rgba(0,0,0,0.08);
        --shadow-md: 0 8px 24px rgba(0,0,0,0.12), 0 2px 6px rgba(0,0,0,0.08);
        --glass-blur: 8px;
        /* Column width tokens */
        --col-check-width: 10px;
        --col-name-width: 14ch;
        --col-organization-width: 12ch;
        --col-photo-width: 120px;
        --col-handover_on-width: 6ch;
        --col-status-width: 5ch;
        --col-admin_note-width: 30ch;
      }
      @media (max-width: 1280px) { :root { --col-name-width:16ch; --col-organization-width:12ch; --col-handover_on-width:10ch; --col-status-width:9ch; --col-admin_note-width:20ch; } }
      @media (max-width: 960px) { :root { --col-name-width:14ch; --col-organization-width:10ch; --col-handover_on-width:20ch; --col-status-width:8ch; --col-admin_note-width:18ch; } }

      html, body {
        background-color: var(--surface);
        background-image:
          radial-gradient(rgba(0,0,0,0.025) 0.5px, transparent 0.6px),
          radial-gradient(rgba(0,0,0,0.02) 0.5px, transparent 0.6px),
          repeating-linear-gradient(45deg, rgba(0,0,0,0.02) 0, rgba(0,0,0,0.02) 2px, transparent 2px, transparent 6px),
          repeating-linear-gradient(-45deg, rgba(0,0,0,0.015) 0, rgba(0,0,0,0.015) 1.5px, transparent 1.5px, transparent 5px);
        background-size: 22px 22px, 28px 28px, 180px 180px, 200px 200px;
        background-position: 0 0, 8px 8px, 0 0, 0 0;
        color: var(--text);
        font-family: system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans JP","Hiragino Kaku Gothic ProN",Meiryo,sans-serif;
        line-height: 1.6;
      }
      .header-container {
        display:flex;justify-content:space-between;align-items:center;margin:10px 8px;padding:8px 10px;
        background: var(--card);
        border:1px solid var(--border);border-left:6px solid var(--primary);border-radius:var(--radius);
        box-shadow: var(--shadow-sm);backdrop-filter: blur(var(--glass-blur));-webkit-backdrop-filter: blur(var(--glass-blur));
        gap:8px;
      }
      .title-group {display:flex;flex-direction:column;gap:2px;}
      .app-title {margin:0;font-size:26px;font-weight:800;letter-spacing:.2px;background:linear-gradient(90deg,var(--primary-600),var(--primary));-webkit-background-clip:text;background-clip:text;color:transparent;}
      .app-subtitle {margin:0;font-size:12px;color:var(--muted);}
      .controls {display:flex;align-items:center;gap:10px;}
      .button-left, .button-group {display:flex;gap:8px;}
      .button-left button, .button-group button {padding:8px 16px;font-size:14px;cursor:pointer;border:1px solid var(--border);border-radius:var(--radius);transition:background-color .15s ease,color .15s ease,border-color .15s ease,transform .02s ease;}
      .button-left button {background-color:var(--primary);border-color:var(--primary);color:#fff;}
      .button-left button:hover {background-color:var(--primary-600);} .button-left button:active, .button-group button:active {transform:translateY(1px);} .button-left button:focus-visible, .button-group button:focus-visible {outline:3px solid var(--focus-ring);outline-offset:2px;}
      .button-group button {background-color:var(--card);color:var(--text);}
      .button-group button:first-child {background-color: var(--success); color:#fff; border-color: var(--success);}
      .button-group button:first-child:hover {background-color: var(--success-hover);} 
      .button-group button:nth-child(2) {background-color: var(--warning); color:#fff; border-color: var(--warning);}
      .button-group button:nth-child(2):hover {background-color: var(--warning-hover);} 
      .button-group button:last-child {background-color: var(--danger); color:#fff; border-color: var(--danger);}
      .button-group button:last-child:hover {background-color: var(--danger-hover);} 

      table {border-collapse: collapse; width:100%; margin-top:20px; border-spacing:0; table-layout:auto; background:var(--card); border:2px solid var(--table-border); border-radius:var(--radius); overflow:hidden; box-shadow: var(--shadow-md);}
      th, td {border:1px solid var(--border); padding:8px; text-align:left; letter-spacing:0; word-spacing:0; color: var(--text);}
      th {background-color: var(--thead-bg); color: var(--primary-600); position: sticky; top:0; z-index:1; backdrop-filter: blur(6px);}
      tr:nth-child(even) {background-color: var(--row-alt);} tbody tr:hover {background-color: var(--row-hover);} 
      tbody tr:has(input[type="checkbox"]:checked) {background-color: var(--row-selected); outline:2px solid rgba(16,185,129,0.35); outline-offset:-2px;}

      /* Tooltip for email */
      td[data-email] {position:relative; cursor:pointer;}
      td[data-email]:hover::after, td[data-email]:focus-visible::after {content: attr(data-email); position:absolute; bottom:100%; left:50%; transform:translateX(-50%); background-color: var(--tooltip-bg); color: var(--tooltip-fg); border-radius:4px; z-index:1000; box-shadow:0 2px 5px rgba(0,0,0,0.2); font-size:25px; line-height:1.5; padding:10px 14px; max-width:900px; white-space:normal; letter-spacing:0; word-spacing:0;}
      td[data-email]:hover::before, td[data-email]:focus-visible::before {content:''; position:absolute; bottom:calc(100% - 2px); left:50%; transform:translateX(-50%); border:7px solid transparent; border-top-color: var(--tooltip-bg); z-index:1000;}

      /* Checkbox larger */
      table input[type="checkbox"] {transform: scale(2.2); transform-origin:center; margin:5px 6px 2px 6px; accent-color: var(--primary);}
      thead th:first-child, tbody td:first-child, th.col-check, td.col-check {min-width:56px; text-align:center;}

      /* Column-specific alignment */
      thead th.col-name, tbody td.col-name { white-space:nowrap; }
      thead th.col-photo, tbody td.col-photo { text-align:center; }
      thead th.col-handover_on, tbody td.col-handover_on { white-space:nowrap; }
      tbody td.col-handover_on { overflow:hidden; text-overflow:ellipsis; }

      /* Column width hooks */
      table col.col-check        { width: var(--col-check-width); }
      table col.col-name         { width: var(--col-name-width); }
      table col.col-organization { width: var(--col-organization-width); }
      table col.col-photo        { width: var(--col-photo-width); }
      table col.col-handover_on  { width: var(--col-handover_on-width); }
      table col.col-status       { width: var(--col-status-width); }
      table col.col-admin_note   { width: var(--col-admin_note-width); }

      @media (max-width: 960px) { table {display:block; overflow-x:auto; white-space:nowrap;} th, td {white-space:nowrap;} }
      @media (prefers-color-scheme: dark) { :root { --surface:#0f1314; --card:#121a1a; --border:#223232; --text:#e5e7eb; --row-alt:#0f1717; --row-hover:#142020; --row-selected:#102525; } }
    </style>
  </head>
  <body>
    <div class="header-container">
      <div class="title-group">
        <h1 class="app-title">スプレッドシート 管理シート<?!= sheetName ?></h1>
      </div>
      <div class="controls">
        <div class="button-left">
          <button>アーカイブへ</button>
        </div>
        <div class="button-group">
          <button>完了</button>
          <button>破棄</button>
          <button>削除</button>
        </div>
      </div>
    </div>
    <? if (!data || data.length === 0) { ?>
      <p>データがありません</p>
    <? } else { ?>
      <table>
        <colgroup>
          <col class="col-check">
          <col class="col-name">
          <col class="col-organization">
          <col class="col-photo">
          <col class="col-handover_on">
          <col class="col-status">
          <col class="col-admin_note">
        </colgroup>
        <thead>
          <tr>
            <th class="col-check">check</th>
            <? 
              var header = data[0];
              for (var j = 0; j < header.length; j++) {
            ?>
              <? if (j+1 === registered) { ?>
                <!-- 列の省略 -->
              <? } else if (j+1 === email) { ?>
                <!-- 列の省略 -->
              <? } else if (j+1 === days) { ?>
                <!-- 列の省略 -->
              <? } else { ?>
                <? if (j+1 === name) { ?>
                  <th class="col-name"><?!= header[j] != null ? header[j] : "" ?></th>
                <? } else if (j+1 === photo) { ?>
                  <th class="col-photo"><?!= header[j] != null ? header[j] : "" ?></th>
                <? } else if (header[j] === 'organization') { ?>
                  <th class="col-organization"><?!= header[j] ?></th>
                <? } else if (header[j] === 'handover_on') { ?>
                  <th class="col-handover_on"><?!= header[j] ?></th>
                <? } else if (header[j] === 'status') { ?>
                  <th class="col-status"><?!= header[j] ?></th>
                <? } else if (header[j] === 'admin_note') { ?>
                  <th class="col-admin_note"><?!= header[j] ?></th>
                <? } else { ?>
                  <th><?!= header[j] != null ? header[j] : "" ?></th>
                <? } ?>
              <? } ?>
            <? } ?>
          </tr>
        </thead>
        <tbody>
          <? for (var i = 1; i < data.length; i++) { ?>
            <tr>
              <td class="col-check"><input type="checkbox"></td>
              <? for (var j = 0; j < data[i].length; j++) { ?>
                <? if (j+1 === registered) { ?>
                <!-- 列の省略 -->
                <? } else if (j+1 === email) { ?>
                <!-- 列の省略 -->
                <? } else if (j+1 === name) { ?>
                  <td class="col-name" data-email="<?!= data[i][j - 1] ?>"><?!= data[i][j] != null ? data[i][j] : "" ?></td>
                <? } else if (j+1 === photo) { ?>
                  <? if (data[i][j] !== "") { ?>
                    <? var imgUrl = "https://lh3.googleusercontent.com/d/" + data[i][j]; ?>
                    <td class="col-photo"><img src="<?!= imgUrl ?>" style="width:40px; height:40px; border-radius:50%;"></td>
                  <? } else { ?>
                    <td class="col-photo"></td>
                  <? } ?>
                <? } else if (j+1 === days) { ?>
                <!-- 列の省略 -->
                <? } else { ?>
                  <? var cellHeader = header[j]; ?>
                  <? if (cellHeader === 'organization') { ?>
                    <td class="col-organization"><?!= data[i][j] != null ? data[i][j] : "" ?></td>
                  <? } else if (cellHeader === 'handover_on') { ?>
                    <td class="col-handover_on"><?!= data[i][j] != null ? data[i][j] : "" ?></td>
                  <? } else if (cellHeader === 'status') { ?>
                    <td class="col-status"><?!= data[i][j] != null ? data[i][j] : "" ?></td>
                  <? } else if (cellHeader === 'admin_note') { ?>
                    <td class="col-admin_note"><?!= data[i][j] != null ? data[i][j] : "" ?></td>
                  <? } else { ?>
                    <td><?!= data[i][j] != null ? data[i][j] : "" ?></td>
                  <? } ?>
                <? } ?>
              <? } ?>
            </tr>
          <? } ?>
        </tbody>
      </table>
    <? } ?>
  </body>
</html>
