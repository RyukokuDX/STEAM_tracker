<!DOCTYPE html>
<html>
  <head>
    <base target="_top">
  </head>
  <body>
    <h1>スプレッドシート：シート1</h1>

    <? if (!data || data.length === 0) { ?>
      <p>データがありません</p>
    <? } else { ?>
      <table>
        <thead>
          <tr>
            <?
              const header = data[0];
              for (let j = 0; j < header.length; j++) {
            ?>
              <th><?= header[j] !== null && header[j] !== undefined ? header[j] : "" ?></th>
            <? } ?>
          </tr>
        </thead>
        <tbody>
          <?
            for (let i = 1; i < data.length; i++) {
          ?>
            <tr>
              <?
                for (let j = 0; j < data[i].length; j++) {
              ?>
                <td><?= data[i][j] !== null && data[i][j] !== undefined ? data[i][j] : "" ?></td>
              <? } ?>
            </tr>
          <? } ?>
        </tbody>
      </table>
    <? } ?>
  </body>
</html>
